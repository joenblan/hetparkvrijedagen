<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>Vrije dagen 2026-2027</title>
<style>
/* Alles is in vh gezet en het scherm is 16:9, dus de pagina schaalt mee met
   elke resolutie die die verhouding heeft. Ontworpen voor 1920x1080. */
:root {
  --achtergrond: #0e1a20;
  --paneel: #16242c;
  --lijn: #24363f;
  --tekst: #f0f5f6;
  --gedempt: #93a7b1;
  --vakantie: #57c9ac;
  --feestdag: #7bb0ef;
  --studiedag: #edb75a;
  --facultatief: #edb75a;
  --vrije-dag: #edb75a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  cursor: none;
  background: var(--achtergrond);
  color: var(--tekst);
  font-family: "Segoe UI", Roboto, "Helvetica Neue", Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

#scherm {
  width: 100%; height: 100%;
  display: grid;
  grid-template-rows: 11vh 1fr 5vh;
  padding: 0 4vh;
  /* zie pixelShift() onderaan: verschuift traag een paar pixels tegen inbranden */
  will-change: transform;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 0.2vh solid var(--lijn);
}
header .titel { font-size: 3.4vh; font-weight: 600; letter-spacing: -0.01em; }
header .vandaag { font-size: 3vh; color: var(--gedempt); font-variant-numeric: tabular-nums; }

main {
  display: grid;
  grid-template-columns: 37% 1fr;
  gap: 5vh;
  align-items: stretch;
  padding: 5vh 0;
}

/* ---- linkerpaneel: de eerstvolgende vrije dag ---- */
#hero {
  background: var(--paneel);
  border-left: 1vh solid var(--accent, var(--vakantie));
  padding: 5vh 4vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
#hero .aanloop { font-size: 2.8vh; color: var(--gedempt); margin-bottom: 1.5vh; }
#hero .teller {
  font-size: 11vh;
  line-height: 1;
  font-weight: 700;
  letter-spacing: -0.03em;
  color: var(--accent, var(--vakantie));
  margin-bottom: 3vh;
}
#hero .teller.kort { font-size: 8.5vh; }
#hero .naam { font-size: 5.2vh; line-height: 1.1; font-weight: 600; letter-spacing: -0.015em; }
#hero .wanneer { font-size: 3.2vh; color: var(--gedempt); margin-top: 1.5vh; }

/* ---- rechterkolom: de rest van het schooljaar ---- */
#daarna { display: flex; flex-direction: column; min-height: 0; }
#daarna h2 {
  font-size: 2.6vh;
  font-weight: 600;
  color: var(--gedempt);
  padding-bottom: 1.5vh;
  border-bottom: 0.2vh solid var(--lijn);
}
#lijst { list-style: none; flex: 1; min-height: 0; overflow: hidden; }
#lijst li {
  display: grid;
  grid-template-columns: 28vh 1fr;
  gap: 3vh;
  align-items: baseline;
  padding: 2vh 0 2vh 2vh;
  border-bottom: 0.2vh solid var(--lijn);
  border-left: 0.5vh solid var(--accent);
}
#lijst .datum {
  font-size: 3.4vh;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
#lijst .naam { font-size: 3.6vh; font-weight: 500; }
#lijst .noot { font-size: 2.4vh; color: var(--gedempt); }
#meer { font-size: 2.6vh; color: var(--gedempt); padding-top: 2vh; }

#leeg {
  grid-column: 1 / -1;
  align-self: center;
  text-align: center;
  font-size: 5vh;
  color: var(--gedempt);
}

footer {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  font-size: 1.9vh;
  color: var(--lijn);
  border-top: 0.2vh solid var(--lijn);
}
</style>
</head>
<body>

<div id="scherm">
  <header>
    <div class="titel">Vrije dagen schooljaar 2026-2027</div>
    <div class="vandaag" id="vandaag"></div>
  </header>

  <main id="inhoud"></main>

  <footer>Kalender bijgewerkt op 15 september 2026</footer>
</div>

<script>
const DATA = {"schooljaar": "2026-2027", "bijgewerkt_op": "2026-09-15", "items": [{"naam": "Pedagogische studiedag", "start": "2026-09-23", "eind": "2026-09-23", "categorie": "studiedag", "bron": "schoolkalender", "omschrijving": "", "tags": [], "dagen": 1, "categorie_label": "Pedagogische studiedag", "periode": "woensdag 23 september 2026", "kort": "wo 23 sep", "enkel_weekend": false, "id": "pedagogische-studiedag-2026-09-23"}, {"naam": "Herfstvakantie", "start": "2026-11-02", "eind": "2026-11-08", "categorie": "vakantie", "bron": "vlaanderen.be", "omschrijving": "", "tags": [], "dagen": 7, "categorie_label": "Vakantie", "periode": "maandag 2 t.e.m. zondag 8 november 2026", "kort": "ma 2 – zo 8 nov", "enkel_weekend": false, "id": "herfstvakantie-2026-11-02"}, {"naam": "Wapenstilstand", "start": "2026-11-11", "eind": "2026-11-11", "categorie": "feestdag", "bron": "vlaanderen.be", "omschrijving": "", "tags": [], "dagen": 1, "categorie_label": "Wettelijke feestdag", "periode": "woensdag 11 november 2026", "kort": "wo 11 nov", "enkel_weekend": false, "id": "wapenstilstand-2026-11-11"}, {"naam": "Pedagogische studiedag", "start": "2026-12-02", "eind": "2026-12-02", "categorie": "studiedag", "bron": "schoolkalender", "omschrijving": "", "tags": [], "dagen": 1, "categorie_label": "Pedagogische studiedag", "periode": "woensdag 2 december 2026", "kort": "wo 2 dec", "enkel_weekend": false, "id": "pedagogische-studiedag-2026-12-02"}, {"naam": "Kerstvakantie", "start": "2026-12-21", "eind": "2027-01-03", "categorie": "vakantie", "bron": "vlaanderen.be", "omschrijving": "", "tags": [], "dagen": 14, "categorie_label": "Vakantie", "periode": "maandag 21 december 2026 t.e.m. zondag 3 januari 2027", "kort": "ma 21 dec – zo 3 jan", "enkel_weekend": false, "id": "kerstvakantie-2026-12-21"}, {"naam": "Krokusvakantie", "start": "2027-02-08", "eind": "2027-02-14", "categorie": "vakantie", "bron": "vlaanderen.be", "omschrijving": "", "tags": [], "dagen": 7, "categorie_label": "Vakantie", "periode": "maandag 8 t.e.m. zondag 14 februari 2027", "kort": "ma 8 – zo 14 feb", "enkel_weekend": false, "id": "krokusvakantie-2027-02-08"}, {"naam": "Paasvakantie", "start": "2027-03-29", "eind": "2027-04-11", "categorie": "vakantie", "bron": "vlaanderen.be", "omschrijving": "", "tags": [], "dagen": 14, "categorie_label": "Vakantie", "periode": "maandag 29 maart 2027 t.e.m. zondag 11 april 2027", "kort": "ma 29 mrt – zo 11 apr", "enkel_weekend": false, "id": "paasvakantie-2027-03-29"}, {"naam": "Dag van de Arbeid", "start": "2027-05-01", "eind": "2027-05-01", "categorie": "feestdag", "bron": "vlaanderen.be", "omschrijving": "", "tags": [], "dagen": 1, "categorie_label": "Wettelijke feestdag", "periode": "zaterdag 1 mei 2027", "kort": "za 1 mei", "enkel_weekend": true, "id": "dag-van-de-arbeid-2027-05-01"}, {"naam": "Pedagogische studiedag", "start": "2027-05-05", "eind": "2027-05-05", "categorie": "studiedag", "bron": "schoolkalender", "omschrijving": "", "tags": [], "dagen": 1, "categorie_label": "Pedagogische studiedag", "periode": "woensdag 5 mei 2027", "kort": "wo 5 mei", "enkel_weekend": false, "id": "pedagogische-studiedag-2027-05-05"}, {"naam": "Hemelvaart", "start": "2027-05-06", "eind": "2027-05-07", "categorie": "feestdag", "bron": "vlaanderen.be", "omschrijving": "", "tags": [], "dagen": 2, "categorie_label": "Wettelijke feestdag", "periode": "donderdag 6 t.e.m. vrijdag 7 mei 2027", "kort": "do 6 – vr 7 mei", "enkel_weekend": false, "id": "hemelvaart-2027-05-06"}, {"naam": "Pinkstermaandag", "start": "2027-05-17", "eind": "2027-05-17", "categorie": "feestdag", "bron": "vlaanderen.be", "omschrijving": "", "tags": [], "dagen": 1, "categorie_label": "Wettelijke feestdag", "periode": "maandag 17 mei 2027", "kort": "ma 17 mei", "enkel_weekend": false, "id": "pinkstermaandag-2027-05-17"}, {"naam": "Zomervakantie", "start": "2027-07-01", "eind": "2027-08-31", "categorie": "vakantie", "bron": "vlaanderen.be", "omschrijving": "", "tags": [], "dagen": 62, "categorie_label": "Vakantie", "periode": "donderdag 1 juli 2027 t.e.m. dinsdag 31 augustus 2027", "kort": "do 1 jul – di 31 aug", "enkel_weekend": false, "id": "zomervakantie-2027-07-01"}]};

// Hoeveel regels er rechts passen. Meer dan 7 wordt op 1080 te krap.
const MAX_REGELS = 7;
// Elke 30 minuten de pagina opnieuw ophalen, zodat een nieuwe build binnenkomt.
const HERLAAD_MS = 30 * 60 * 1000;

const KLEUR = {
  vakantie: "var(--vakantie)",
  feestdag: "var(--feestdag)",
  studiedag: "var(--studiedag)",
  facultatief: "var(--facultatief)",
  "vrije-dag": "var(--vrije-dag)",
};

const WEEKDAGEN = ["zondag", "maandag", "dinsdag", "woensdag", "donderdag",
                   "vrijdag", "zaterdag"];
const MAANDEN = ["januari", "februari", "maart", "april", "mei", "juni", "juli",
                 "augustus", "september", "oktober", "november", "december"];

function alsDatum(iso) {
  const [j, m, d] = iso.split("-").map(Number);
  return new Date(j, m - 1, d);
}
function vandaag() {
  const n = new Date();
  return new Date(n.getFullYear(), n.getMonth(), n.getDate());
}
function dagenTussen(a, b) {
  return Math.round((b - a) / 86400000);
}
function esc(s) {
  return String(s).replace(/[&<>"]/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function teken() {
  const nu = vandaag();
  document.getElementById("vandaag").textContent =
    WEEKDAGEN[nu.getDay()] + " " + nu.getDate() + " " + MAANDEN[nu.getMonth()];

  const komend = DATA.items.filter(i => alsDatum(i.eind) >= nu);
  const inhoud = document.getElementById("inhoud");

  if (komend.length === 0) {
    inhoud.innerHTML =
      '<p id="leeg">Geen vrije dagen meer dit schooljaar.</p>';
    return;
  }

  // Een feestdag die volledig in het weekend valt is geen extra vrije dag en
  // hoort dus niet groot in beeld. In de lijst blijft hij wel staan.
  const hero = komend.find(i => !i.enkel_weekend) || komend[0];
  const rest = komend.filter(i => i !== hero);

  const kleur = KLEUR[hero.categorie] || "var(--vakantie)";
  const start = alsDatum(hero.start);
  const eind = alsDatum(hero.eind);

  let aanloop, teller, kortTeller = false;
  if (start <= nu) {
    const over = dagenTussen(nu, eind) + 1;
    aanloop = "Nu bezig";
    teller = over === 1 ? "Laatste dag" : "Nog " + over + " dagen";
    kortTeller = over === 1;
  } else {
    const tot = dagenTussen(nu, start);
    aanloop = "Eerstvolgende vrije dag";
    if (tot === 1) { teller = "Morgen"; }
    else { teller = "Over " + tot + " dagen"; }
  }

  let html =
    '<section id="hero" style="--accent:' + kleur + '">' +
      '<p class="aanloop">' + aanloop + '</p>' +
      '<p class="teller' + (kortTeller ? " kort" : "") + '">' + teller + '</p>' +
      '<p class="naam">' + esc(hero.naam) + '</p>' +
      '<p class="wanneer">' + esc(hero.periode) + '</p>' +
    '</section>';

  html += '<section id="daarna"><h2>Daarna dit schooljaar</h2><ul id="lijst">';
  rest.slice(0, MAX_REGELS).forEach(i => {
    const c = KLEUR[i.categorie] || "var(--vakantie)";
    html +=
      '<li style="--accent:' + c + '">' +
        '<span class="datum">' + esc(i.kort) + '</span>' +
        '<span class="naam">' + esc(i.naam) +
          (i.enkel_weekend ? '<span class="noot"> \u00b7 valt in het weekend</span>' : '') +
        '</span>' +
      '</li>';
  });
  html += '</ul>';
  const over = rest.length - MAX_REGELS;
  if (over > 0) {
    html += '<p id="meer">En nog ' + over +
            (over === 1 ? ' vrije periode' : ' vrije periodes') +
            ' later dit schooljaar.</p>';
  }
  html += '</section>';

  inhoud.innerHTML = html;
}

// Een scherm dat maandenlang hetzelfde toont brandt in. Elke vijf minuten
// een paar pixels opschuiven is genoeg om dat te voorkomen.
const SCHUIF = [[0, 0], [2, 1], [3, 0], [2, -1], [0, -2], [-2, -1], [-3, 0], [-2, 1]];
let schuifIndex = 0;
function pixelShift() {
  const [x, y] = SCHUIF[schuifIndex % SCHUIF.length];
  document.getElementById("scherm").style.transform =
    "translate(" + x + "px," + y + "px)";
  schuifIndex++;
}

teken();
pixelShift();
// Elke minuut opnieuw tekenen, zodat de teller om middernacht meeschuift ook
// als de pagina al dagen openstaat.
setInterval(teken, 60 * 1000);
setInterval(pixelShift, 5 * 60 * 1000);
setTimeout(() => location.reload(), HERLAAD_MS);
</script>

</body>
</html>
