<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>Vrije dagen 2026-2027</title>
<!-- General Sans is het huislettertype. Laadt die niet, dan valt de pagina
     terug op Arial, precies zoals de skin van de site zelf doet. -->
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap">
<style>
/* Kleuren komen uit skin-bshetpark.css:
   color1 = teal (#009886 / #027265 / #004d44 / #55c5b8)
   color2 = limoen (#a1d683)
   Op een scherm in de gang leest lichte tekst op diep teal rustiger dan
   zwart op wit, en het blijft herkenbaar de huisstijl. */
:root {
  --merk-diep: #004d44;
  --merk-paneel: #00655a;
  --merk-teal: #009886;
  --lijn: rgba(220, 248, 244, 0.18);
  --tekst: #ffffff;
  --gedempt: #9ecfc7;

  --vakantie: #a1d683;   /* color2-base */
  --feestdag: #55c5b8;   /* color1-light */
  --studiedag: #ffffff;  /* door de school zelf gekozen: sterkste accent */
  --facultatief: #ffffff;
  --vrije-dag: #ffffff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  cursor: none;
  background: var(--merk-diep);
  color: var(--tekst);
  font-family: "General Sans", "GeneralSans", Arial, Helvetica,
               "Helvetica Neue", sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* Alles in vh, het scherm is 16:9, dus dit schaalt mee met elke resolutie
   met die verhouding. Ontworpen voor 1920x1080. */
#scherm {
  width: 100%; height: 100%;
  display: grid;
  grid-template-rows: 12vh 1fr 5vh;
  padding: 0 4vh;
  will-change: transform;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 5vh;
  border-bottom: 0.3vh solid var(--merk-teal);
}
header .merk { font-size: 2.2vh; color: var(--gedempt); margin-bottom: 0.4vh; }
header .titel { font-size: 3.6vh; font-weight: 600; letter-spacing: -0.015em; }
header .vandaag {
  font-size: 3vh;
  color: var(--gedempt);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

main {
  display: grid;
  grid-template-columns: 37% minmax(0, 1fr);
  gap: 5vh;
  padding: 5vh 0;
  min-height: 0;
}

/* ---- links: de eerstvolgende vrije dag ---- */
#hero {
  background: var(--merk-paneel);
  border-left: 1vh solid var(--accent, var(--vakantie));
  padding: 5vh 4vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 0;
}
#hero .aanloop { font-size: 2.8vh; color: var(--gedempt); margin-bottom: 2.5vh; }
#hero .naam {
  font-size: 6.4vh;
  line-height: 1.08;
  font-weight: 600;
  letter-spacing: -0.02em;
  overflow-wrap: anywhere;
}
#hero .naam.lang { font-size: 5.2vh; }
#hero .wanneer {
  font-size: 4.4vh;
  line-height: 1.2;
  font-weight: 500;
  color: var(--accent, var(--vakantie));
  margin-top: 2.5vh;
}

/* ---- rechts: de rest van het schooljaar ---- */
#daarna { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
#daarna h2 {
  font-size: 2.6vh;
  font-weight: 600;
  color: var(--gedempt);
  padding-bottom: 1.5vh;
  border-bottom: 0.2vh solid var(--lijn);
}

/* De datumkolom staat op 'max-content': ze wordt precies zo breed als de
   langste datum in de lijst ("ma 21 dec - zo 3 jan"). Daardoor kan tekst
   nooit over de naamkolom heen vallen, hoe lang de datum ook wordt. De li's
   staan op display:contents zodat beide cellen in hetzelfde raster liggen en
   alle datums netjes onder elkaar uitkomen. */
#lijst {
  list-style: none;
  display: grid;
  grid-template-columns: max-content minmax(0, 1fr);
  align-content: start;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}
#lijst li { display: contents; }
#lijst .datum {
  grid-column: 1;
  padding: 2vh 3vh 2vh 2vh;
  border-left: 0.5vh solid var(--accent);
  border-bottom: 0.2vh solid var(--lijn);
  font-size: 3.2vh;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
#lijst .naam {
  grid-column: 2;
  padding: 2vh 0;
  border-bottom: 0.2vh solid var(--lijn);
  font-size: 3.4vh;
  font-weight: 500;
  min-width: 0;
  overflow-wrap: anywhere;
}
#lijst .noot { color: var(--gedempt); font-weight: 400; font-size: 2.6vh; }
#meer { font-size: 2.6vh; color: var(--gedempt); padding-top: 2vh; }

#leeg {
  grid-column: 1 / -1;
  align-self: center;
  text-align: center;
  font-size: 5vh;
  color: var(--gedempt);
}

footer {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  font-size: 1.9vh;
  color: var(--lijn);
  border-top: 0.2vh solid var(--lijn);
}
</style>
</head>
<body>

<div id="scherm">
  <header>
    <div>
<div class="merk">Basisschool Het Park</div>      <div class="titel">Vrije dagen schooljaar 2026-2027</div>
    </div>
    <div class="vandaag" id="vandaag"></div>
  </header>

  <main id="inhoud"></main>

  <footer>Kalender bijgewerkt op 18 september 2026</footer>
</div>

<script>
const DATA = {"schooljaar": "2026-2027", "bijgewerkt_op": "2026-09-18", "items": [{"naam": "Pedagogische studiedag", "start": "2026-09-23", "eind": "2026-09-23", "categorie": "studiedag", "bron": "schoolkalender", "omschrijving": "", "tags": [], "dagen": 1, "categorie_label": "Pedagogische studiedag", "periode": "woensdag 23 september 2026", "kort": "wo 23 sep", "enkel_weekend": false, "id": "pedagogische-studiedag-2026-09-23"}, {"naam": "Herfstvakantie", "start": "2026-11-02", "eind": "2026-11-08", "categorie": "vakantie", "bron": "vlaanderen.be", "omschrijving": "", "tags": [], "dagen": 7, "categorie_label": "Vakantie", "periode": "maandag 2 t.e.m. zondag 8 november 2026", "kort": "ma 2 – zo 8 nov", "enkel_weekend": false, "id": "herfstvakantie-2026-11-02"}, {"naam": "Wapenstilstand", "start": "2026-11-11", "eind": "2026-11-11", "categorie": "feestdag", "bron": "vlaanderen.be", "omschrijving": "", "tags": [], "dagen": 1, "categorie_label": "Wettelijke feestdag", "periode": "woensdag 11 november 2026", "kort": "wo 11 nov", "enkel_weekend": false, "id": "wapenstilstand-2026-11-11"}, {"naam": "Pedagogische studiedag", "start": "2026-12-02", "eind": "2026-12-02", "categorie": "studiedag", "bron": "schoolkalender", "omschrijving": "", "tags": [], "dagen": 1, "categorie_label": "Pedagogische studiedag", "periode": "woensdag 2 december 2026", "kort": "wo 2 dec", "enkel_weekend": false, "id": "pedagogische-studiedag-2026-12-02"}, {"naam": "Kerstvakantie", "start": "2026-12-21", "eind": "2027-01-03", "categorie": "vakantie", "bron": "vlaanderen.be", "omschrijving": "", "tags": [], "dagen": 14, "categorie_label": "Vakantie", "periode": "maandag 21 december 2026 t.e.m. zondag 3 januari 2027", "kort": "ma 21 dec – zo 3 jan", "enkel_weekend": false, "id": "kerstvakantie-2026-12-21"}, {"naam": "Krokusvakantie", "start": "2027-02-08", "eind": "2027-02-14", "categorie": "vakantie", "bron": "vlaanderen.be", "omschrijving": "", "tags": [], "dagen": 7, "categorie_label": "Vakantie", "periode": "maandag 8 t.e.m. zondag 14 februari 2027", "kort": "ma 8 – zo 14 feb", "enkel_weekend": false, "id": "krokusvakantie-2027-02-08"}, {"naam": "Paasvakantie", "start": "2027-03-29", "eind": "2027-04-11", "categorie": "vakantie", "bron": "vlaanderen.be", "omschrijving": "", "tags": [], "dagen": 14, "categorie_label": "Vakantie", "periode": "maandag 29 maart 2027 t.e.m. zondag 11 april 2027", "kort": "ma 29 mrt – zo 11 apr", "enkel_weekend": false, "id": "paasvakantie-2027-03-29"}, {"naam": "Dag van de Arbeid", "start": "2027-05-01", "eind": "2027-05-01", "categorie": "feestdag", "bron": "vlaanderen.be", "omschrijving": "", "tags": [], "dagen": 1, "categorie_label": "Wettelijke feestdag", "periode": "zaterdag 1 mei 2027", "kort": "za 1 mei", "enkel_weekend": true, "id": "dag-van-de-arbeid-2027-05-01"}, {"naam": "Pedagogische studiedag", "start": "2027-05-05", "eind": "2027-05-05", "categorie": "studiedag", "bron": "schoolkalender", "omschrijving": "", "tags": [], "dagen": 1, "categorie_label": "Pedagogische studiedag", "periode": "woensdag 5 mei 2027", "kort": "wo 5 mei", "enkel_weekend": false, "id": "pedagogische-studiedag-2027-05-05"}, {"naam": "Hemelvaart", "start": "2027-05-06", "eind": "2027-05-07", "categorie": "feestdag", "bron": "vlaanderen.be", "omschrijving": "", "tags": [], "dagen": 2, "categorie_label": "Wettelijke feestdag", "periode": "donderdag 6 t.e.m. vrijdag 7 mei 2027", "kort": "do 6 – vr 7 mei", "enkel_weekend": false, "id": "hemelvaart-2027-05-06"}, {"naam": "Pinkstermaandag", "start": "2027-05-17", "eind": "2027-05-17", "categorie": "feestdag", "bron": "vlaanderen.be", "omschrijving": "", "tags": [], "dagen": 1, "categorie_label": "Wettelijke feestdag", "periode": "maandag 17 mei 2027", "kort": "ma 17 mei", "enkel_weekend": false, "id": "pinkstermaandag-2027-05-17"}, {"naam": "Zomervakantie", "start": "2027-07-01", "eind": "2027-08-31", "categorie": "vakantie", "bron": "vlaanderen.be", "omschrijving": "", "tags": [], "dagen": 62, "categorie_label": "Vakantie", "periode": "donderdag 1 juli 2027 t.e.m. dinsdag 31 augustus 2027", "kort": "do 1 jul – di 31 aug", "enkel_weekend": false, "id": "zomervakantie-2027-07-01"}]};

// Hoeveel regels er rechts passen. Meer dan 7 wordt op 1080 te krap.
const MAX_REGELS = 7;
// Elke 30 minuten de pagina opnieuw ophalen, zodat een nieuwe build binnenkomt.
const HERLAAD_MS = 30 * 60 * 1000;

const KLEUR = {
  vakantie: "var(--vakantie)",
  feestdag: "var(--feestdag)",
  studiedag: "var(--studiedag)",
  facultatief: "var(--facultatief)",
  "vrije-dag": "var(--vrije-dag)",
};

const WEEKDAGEN = ["zondag", "maandag", "dinsdag", "woensdag", "donderdag",
                   "vrijdag", "zaterdag"];
const MAANDEN = ["januari", "februari", "maart", "april", "mei", "juni", "juli",
                 "augustus", "september", "oktober", "november", "december"];

function alsDatum(iso) {
  const [j, m, d] = iso.split("-").map(Number);
  return new Date(j, m - 1, d);
}
function vandaag() {
  const n = new Date();
  return new Date(n.getFullYear(), n.getMonth(), n.getDate());
}
function dagenTussen(a, b) {
  return Math.round((b - a) / 86400000);
}
function esc(s) {
  return String(s).replace(/[&<>"]/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function teken() {
  const nu = vandaag();
  document.getElementById("vandaag").textContent =
    WEEKDAGEN[nu.getDay()] + " " + nu.getDate() + " " + MAANDEN[nu.getMonth()];

  const komend = DATA.items.filter(i => alsDatum(i.eind) >= nu);
  const inhoud = document.getElementById("inhoud");

  if (komend.length === 0) {
    inhoud.innerHTML = '<p id="leeg">Geen vrije dagen meer dit schooljaar.</p>';
    return;
  }

  // Een feestdag die volledig in het weekend valt is geen extra vrije dag en
  // hoort dus niet groot in beeld. In de lijst blijft hij wel staan.
  const hero = komend.find(i => !i.enkel_weekend) || komend[0];
  const rest = komend.filter(i => i !== hero);

  const kleur = KLEUR[hero.categorie] || "var(--vakantie)";
  const start = alsDatum(hero.start);
  const eind = alsDatum(hero.eind);

  let aanloop;
  if (start <= nu) {
    aanloop = "Nu bezig";
  } else {
    const tot = dagenTussen(nu, start);
    aanloop = tot === 1 ? "Morgen" : "Eerstvolgende vrije dag";
  }

  let html =
    '<section id="hero" style="--accent:' + kleur + '">' +
      '<p class="aanloop">' + aanloop + '</p>' +
      '<p class="naam' + (hero.naam.length > 26 ? " lang" : "") + '">' +
        esc(hero.naam) + '</p>' +
      '<p class="wanneer">' + esc(hero.periode) + '</p>' +
    '</section>';

  html += '<section id="daarna"><h2>Daarna dit schooljaar</h2><ul id="lijst">';
  rest.slice(0, MAX_REGELS).forEach(i => {
    const c = KLEUR[i.categorie] || "var(--vakantie)";
    html +=
      '<li style="--accent:' + c + '">' +
        '<span class="datum">' + esc(i.kort) + '</span>' +
        '<span class="naam">' + esc(i.naam) +
          (i.enkel_weekend
            ? '<span class="noot"> \u00b7 valt in het weekend</span>' : '') +
        '</span>' +
      '</li>';
  });
  html += '</ul>';
  const over = rest.length - MAX_REGELS;
  if (over > 0) {
    html += '<p id="meer">En nog ' + over +
            (over === 1 ? ' vrije periode' : ' vrije periodes') +
            ' later dit schooljaar.</p>';
  }
  html += '</section>';

  inhoud.innerHTML = html;
}

// Een scherm dat maandenlang hetzelfde toont brandt in. Elke vijf minuten
// een paar pixels opschuiven is genoeg om dat te voorkomen.
const SCHUIF = [[0, 0], [2, 1], [3, 0], [2, -1], [0, -2], [-2, -1], [-3, 0], [-2, 1]];
let schuifIndex = 0;
function pixelShift() {
  const [x, y] = SCHUIF[schuifIndex % SCHUIF.length];
  document.getElementById("scherm").style.transform =
    "translate(" + x + "px," + y + "px)";
  schuifIndex++;
}

teken();
pixelShift();
// Elke minuut opnieuw tekenen, zodat de teller om middernacht meeschuift ook
// als de pagina al dagen openstaat.
setInterval(teken, 60 * 1000);
setInterval(pixelShift, 5 * 60 * 1000);
setTimeout(() => location.reload(), HERLAAD_MS);
</script>

</body>
</html>
